<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <h2>Menu</h2>

        <ul class="menu">
            <li><a href="#"><i class="bi bi-house-door-fill"></i> Home</a></li>
            <li><a href="#">Create Invoice</a></li>
            <li><a href="#">Invoice List</a></li>
            <li><a href="#">Clients</a></li>
            <li><a href="#">My Profile</a></li>
            <li><a href="#">Supports</a></li>
            <li><a href="#">Account Settings</a></li>
        </ul>
        <button class="logout">
            <i class="bi bi-arrow-bar-right"></i> Sign Out
        </button>
    </div>
    <div class="dashboard">

        <div class="main">
            <div class="menu-toggle" onclick="toggleSidebar()">
                <i class="bi bi-list"></i>
            </div>
            <div class="topbar">
                <div>
                    <h2>Dashboard</h2>
                    <p>Sales Reports</p>
                </div>

                <div class="user">
                    <img src="https://i.pravatar.cc/40">
                    <span>Hi, Jinan</span>
                </div>
            </div>
            <div class="cards">

                <div class="card cyan">
                    <h2>1210</h2>
                    <p>Remaining Invoice</p>
                </div>

                <div class="card blue">
                    <h2>1209</h2>
                    <p>Remaining Delivery</p>
                </div>

                <div class="card purple">
                    <h2>1032</h2>
                    <p>Remaining Client</p>
                </div>

            </div>

            <div class="search-container">
                <input type="text" placeholder="Search..." class="search-input">
                <button class="search-btn">
                    <i class="bi bi-search"></i>
                </button>
            </div>

            <div class="grid">

                <div class="box">
                    <h3>Income vs Commission</h3>

                    <div class="chart">
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                    </div>

                </div>

                <div class="box seller">

                    <h3>Top Seller</h3>

                    <img src="https://i.pravatar.cc/100">

                    <h4>George Martin</h4>
                    <p>UX Designer</p>

                    <p><b>$1500</b> Sales</p>

                    <button class="btn">View Orders</button>

                </div>

            </div>

        </div>

    </div>
    <script>

        function toggleSidebar() {

            const sidebar = document.getElementById("sidebar");
            const overlay = document.getElementById("overlay");

            sidebar.classList.toggle("active");
            overlay.classList.toggle("active");

        }

    </script>

</body>

</html>
