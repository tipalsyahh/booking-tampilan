<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="setting.css">
    <title>Setting</title>
</head>

<body>
    <div class="container">
        <div class="typing-wrapper">
            <h1 id="typingText"></h1>
        </div>
        <div class="from" id="mainForm" style="display: none;">
            <center>
                <div class="profile-container">
                    <div class="profile-avatar">
                        <img src="img/OIP.webp" alt="Profile" class="profile-img" id="profilePreview">
                    </div>

                    <label for="uploadPhoto" class="camera-icon-wrapper">
                        <svg viewBox="0 0 24 24" class="camera-icon">
                            <path d="M9 3L7.17 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 
                     2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.17L15 
                     3H9zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10z" />
                        </svg>
                    </label>

                    <input type="file" id="uploadPhoto" class="file-input" accept="image/*">
                </div>
            </center>
            <div class="password-header">
                <p class="account-info">tipalsyah_ • E-paper Lampost</p>

                <h2 class="password-title">Ubah kata sandi</h2>

                <p class="password-description">
                    Kata sandi Anda harus paling tidak 6 karakter dan
                    harus menyertakan kombinasi angka, huruf, dan
                    karakter khusus (!$@%).
                </p>
            </div>
            <div class="dropdown-wrapper">
                <button class="dropdown-btn" onclick="toggleDropdown()">
                    <i class="bi bi-arrow-bar-down" id="arrowIcon"></i>
                    <h3>Ubah password</h3>
                </button>
                <div class="dropdown-content" id="dropdownForm">
                    <div class="form-group">
                        <label>Password Baru</label>
                        <div class="input-wrapper">
                            <i class="bi bi-lock-fill input-icon"></i>
                            <span class="input-divider"></span>
                            <input type="password" class="form-input" placeholder="Masukkan password baru">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Konfirmasi Password</label>
                        <div class="input-wrapper">
                            <i class="bi bi-lock-fill input-icon"></i>
                            <span class="input-divider"></span>
                            <input type="password" class="form-input" placeholder="Ulangi password">
                        </div>
                    </div>
                    <button type="submit" class="submit-btn">
                        Simpan
                    </button>
                </div>
            </div>
        </div>
        <script>
            function toggleDropdown() {
                const dropdown = document.getElementById("dropdownForm");
                const arrow = document.getElementById("arrowIcon");

                dropdown.classList.toggle("active");

                if (dropdown.classList.contains("active")) {
                    arrow.classList.remove("bi-arrow-bar-down");
                    arrow.classList.add("bi-arrow-bar-up");
                } else {
                    arrow.classList.remove("bi-arrow-bar-up");
                    arrow.classList.add("bi-arrow-bar-down");
                }
            }
        </script>
        <script>
            const text = "Setting account e-paper premium lampost";
            const typingElement = document.getElementById("typingText");
            const form = document.getElementById("mainForm");

            let index = 0;

            function typeEffect() {
                if (index < text.length) {
                    typingElement.innerHTML += text.charAt(index);
                    index++;
                    setTimeout(typeEffect, 80);
                } else {
                    setTimeout(() => {
                        document.querySelector(".typing-wrapper").style.display = "none";
                        form.style.display = "block";
                        setTimeout(() => {
                            form.style.opacity = "1";
                        }, 50);
                    }, 600);
                }
            }

            window.onload = typeEffect;
        </script>
</body>

</html>
